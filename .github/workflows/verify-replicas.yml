# Byte custody of selected public Drive replicas. Scientific effect: NONE.
name: verify-replicas

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  local-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SOURCE.json vs local replica bytes
        run: python3 scripts/verify_replicas.py
